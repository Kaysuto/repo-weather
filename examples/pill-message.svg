<svg xmlns="http://www.w3.org/2000/svg" width="241" height="28" viewBox="0 0 241 28" role="img" aria-label="Météo du dépôt : Nuageux : 7 issues à trier &amp; classer">
<title>Météo du dépôt : Nuageux : 7 issues à trier &amp; classer</title>
<defs>
<linearGradient id="tint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64748b" stop-opacity="0.22"/><stop offset="0.7" stop-color="#64748b" stop-opacity="0"/></linearGradient>
<radialGradient id="sun" cx="0.35" cy="0.35" r="0.75"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
<linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
