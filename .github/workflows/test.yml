name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Valider action.yml
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml', encoding='utf-8'))"
      - run: npm test
