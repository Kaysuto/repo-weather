# Dogfooding: this repo's own badge, generated by the local version of the action.
name: Météo du dépôt

on:
  schedule:
    - cron: '0 */6 * * *'
  issues:
    types: [opened, closed, reopened]
  workflow_run:
    workflows: [Tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: repo-weather

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
